name: ios

on:
  workflow_dispatch:
    inputs:
      simulator:
        description: Run in the iOS simulator and capture screenshots (~15 macOS minutes)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci && npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/App.xcarchive
          archive CODE_SIGNING_ALLOWED=NO
      - run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -qr Bozy-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Bozy-unsigned
          path: build/Bozy-unsigned.ipa

  simulator:
    if: inputs.simulator
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci && npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim
          build CODE_SIGNING_ALLOWED=NO
      - name: Run in simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" ai.bozy.app
          mkdir -p shots
          for t in 5 15 30; do sleep $((t - ${prev:-0})); prev=$t; xcrun simctl io "$UDID" screenshot "shots/${t}s.png"; done
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "App"' > shots/app.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
